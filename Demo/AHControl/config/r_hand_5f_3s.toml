# Config for the final 5-digit right hand: 3-phalanx index, middle, ring and pinky, slim-mount thumb
# (AH_Right_5F_3S / AH_Right_5F_3S_Wrist; FIVE_FINGER.md, cad/five_finger/ultimate_finger/README.md).
# Same IDs as r_hand_5f.toml (index 1/2, middle 3/4, ring 5/6, thumb 7/8, pinky 9/10), offsets = your calibration:
#   cargo run --bin=get_zeros -- --config AHControl/config/r_hand_5f_3s.toml
#
# `limits` makes AHControl enforce this hand's limits (src/limits.rs, ported from PythonExample/AmazingHand_Demo_5F.py).
# Keep it a top-level key, above [Fingers]. An AHControl without src/limits.rs ignores it (facet_toml drops unknown
# keys) and drives the thumb to (0, 0), inside the palm shell: do not use this file with one.
#  - Thumb (r_finger4): every command is clamped to the slim mount's envelope (layout.THUMB_ENVELOPE, 22 % of the
#    +-90 deg command square). It starts at home (0, 22.5), not at (0, 0).
#  - Fingers: straight at f = (m1 - m2)/2 = -56 deg (stock -37.5); f >= -60 (m1 - m2 >= -120), |a| <= 90 - |f| with
#    a = (m1 + m2)/2, |a| <= 30 towards a neighbour, neighbours converging by <= 15 deg (rising to 30 as the more curled
#    of the two goes from f = 60 to 90). The dora sim/tracking nodes compute stock 2-phalanx finger commands, so expect
#    the limits to cut some of them.
#  - At start (AHControl and set_zeros) the hand goes home from where it is, at 1.5 rad/s along a clamped path.
#  - max_torque_limit (EEPROM addr 16) must be 800 on IDs 1-6 and 9-10 (lower for PETG or PLA cores); AHControl does
#    not set it. Write it once, it stays in the EEPROM:
#      python PythonExample/AmazingHand_Demo_5F.py --port /dev/ttyACM0 --setup-only [--cores petg|pla]
limits = "AH_Right_5F_3S"
[Fingers]
[[motors]]
finger_name="r_finger1"
motor1.id = 1
motor1.offset = 0.12217304763960307
motor1.invert = false
motor1.model = "SCS0009"
motor2.id = 2
motor2.offset = 0.08726646259971647
motor2.invert = false
motor2.model = "SCS0009"
[[motors]]
finger_name="r_finger2"
motor1.id = 3
motor1.offset = 0.0
motor1.invert = false
motor1.model = "SCS0009"
motor2.id = 4
motor2.offset = 0.12217304763960307
motor2.invert = false
motor2.model = "SCS0009"
[[motors]]
finger_name="r_finger3"
motor1.id = 5
motor1.offset = 0.08726646259971647
motor1.invert = false
motor1.model = "SCS0009"
motor2.id = 6
motor2.offset = 0.12217304763960307
motor2.invert = false
motor2.model = "SCS0009"
[[motors]]
finger_name="r_finger5" # pinky
motor1.id = 9
motor1.offset = 0.0 # replace with your calibration (get_zeros)
motor1.invert = false
motor1.model = "SCS0009"
motor2.id = 10
motor2.offset = 0.0 # replace with your calibration (get_zeros)
motor2.invert = false
motor2.model = "SCS0009"
[[motors]]
finger_name="r_finger4" # thumb, slim mount: clamped to its envelope (see the top of this file)
motor1.id = 7
motor1.offset = 0.0
motor1.invert = false
motor1.model = "SCS0009"
motor2.id = 8
motor2.offset = 0.12217304763960307
motor2.invert = false
motor2.model = "SCS0009"
